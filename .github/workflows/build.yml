name: Build ArtFusion APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          rm -rf ArtFusion_V1
          mkdir ArtFusion_V1
          unzip -q ArtFusion_V1_Android_Project.zip -d ArtFusion_V1

      - name: Build debug APK
        working-directory: ArtFusion_V1
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArtFusion-debug-APK
          path: ArtFusion_V1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
