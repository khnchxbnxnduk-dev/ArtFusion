name: Build BDraw APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Extract BDraw project
        run: |
          rm -rf BDraw_V5
          unzip -q BDraw_V5_Android_Project.zip
          test -f BDraw_V5/app/build.gradle

      - name: Build BDraw debug APK
        working-directory: BDraw_V5
        run: gradle assembleDebug --no-daemon

      - name: Upload BDraw APK
        uses: actions/upload-artifact@v4
        with:
          name: BDraw-debug-APK
          path: BDraw_V5/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
